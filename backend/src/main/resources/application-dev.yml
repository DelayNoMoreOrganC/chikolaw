server:
  port: 8080
  servlet:
    context-path: /api
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

spring:
  application:
    name: lawfirm-backend
  config:
    import: optional:file:.env[.properties]

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:${LAWFIRM_H2_PATH:./data/lawfirm};MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  h2:
    console:
      enabled: true
      path: /h2-console

  devtools:
    restart:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        use_sql_comments: false
        globally_quoted_identifiers: true
        jdbc:
          batch_size: 25
    open-in-view: false

  sql:
    init:
      mode: never

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:lawfirm-dev-jwt-secret-change-me}
  expiration: 86400000
  header: Authorization
  prefix: Bearer

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: lawfirm
  connectTimeout: 10000
  writeTimeout: 60000
  readTimeout: 10000

file:
  upload-path: ${LAWFIRM_UPLOAD_PATH:./uploads/}
  max-size: 52428800
  allowed-types:
    - image/jpeg
    - image/png
    - image/gif
    - application/pdf
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.ms-excel
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - text/plain

login:
  max-attempts: 5
  lock-duration: 1800000
  lock-enabled: false

# v2.2 纯 GLM 云端（见 backend/.env）
lawfirm:
  ai:
    mode: cloud-glm

# 纯线上 AI：智谱 GLM Coding Plan（见 backend/.env）
ai:
  ocr:
    enabled: true
    provider: zhipu
    pdf-vision-max-pages: 5
    pdf-vision-dpi: 120

llm:
  timeout: 180000
  connect-timeout: 30000
  retry: 2
  zhipu:
    api-key: ${ZHIPU_API_KEY:${GLM_CODING_API_KEY:}}
    base-url: https://open.bigmodel.cn/api/coding/paas/v4
    chat-model: ${GLM_CHAT_MODEL:glm-4.7}
    vision-model: ${GLM_VISION_MODEL:glm-4.6v}
    max-tokens: 8192
    temperature: 0.3
  fallback:
    enabled: false
    provider: zhipu
  routing:
    legal-chat: zhipu
    rag: zhipu
    document: zhipu
    general-chat: zhipu
    extract: zhipu
    document-recognition-extract: zhipu
    legacy-document: zhipu

agent:
  runtime:
    provider: builtin

qdrant:
  enabled: false

case-search:
  semantic:
    enabled: false

logging:
  level:
    root: INFO
    com.lawfirm: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/lawfirm-backend.log
    max-size: 100MB
    max-history: 30

server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: lawfirm-backend

  profiles:
    active: dev

  datasource:
    driver-class-name: org.h2.Driver
    # 默认相对路径：在 backend 目录下执行 mvn spring-boot:run 时写入 backend/data/
    url: jdbc:h2:file:${LAWFIRM_H2_PATH:./data/lawfirm};MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    hikari:
      # 连接池配置（支持50人并发）
      maximum-pool-size: 50          # 最大连接数：支持50人并发
      minimum-idle: 10               # 最小空闲连接数
      connection-timeout: 30000      # 连接超时：30秒
      idle-timeout: 600000           # 空闲连接超时：10分钟
      max-lifetime: 1800000          # 连接最大生命周期：30分钟
      # 连接测试配置
      connection-test-query: SELECT 1
      validation-timeout: 3000       # 验证超时：3秒
      # 连接泄漏检测
      leak-detection-threshold: 60000  # 泄漏检测阈值：60秒
      # 性能优化
      auto-commit: true              # 自动提交
      transaction-isolation: TRANSACTION_READ_COMMITTED  # 事务隔离级别

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
        globally_quoted_identifiers: true
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

jwt:
  secret: ${JWT_SECRET:lawfirm-dev-jwt-secret-change-me}
  expiration: 86400000
  header: Authorization
  prefix: Bearer

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: lawfirm
  connectTimeout: 10000
  writeTimeout: 60000
  readTimeout: 10000

file:
  upload-path: ${LAWFIRM_UPLOAD_PATH:./uploads/}
  max-size: 52428800
  allowed-types:
    - image/jpeg
    - image/png
    - image/gif
    - application/pdf
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.ms-excel
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - text/plain

login:
  max-attempts: 5
  lock-duration: 1800000

backup:
  base-dir: ${LAWFIRM_BACKUP_DIR:./backups}
  retention-days: 180

crypto:
  secret-key: ${CRYPTO_SECRET_KEY:lawfirm-dev-crypto-secret-change-me}

ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: https://api.deepseek.com
    chat-model: deepseek-chat
    vision-model: deepseek-vl
    max-tokens: 4000
    temperature: 0.7
  ollama:
    base-url: http://localhost:11434
    model: qwen3:8b
    max-tokens: 2000
    temperature: 0.1
    timeout-seconds: 60
  aliyun:
    embedding:
      api-key: ${ALIYUN_API_KEY:your-aliyun-api-key}
      base-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
      model: text-embedding-v3
      dimension: 1024
      timeout-seconds: 30

# LLM API通用配置
llm:
  # DeepSeek配置
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: https://api.deepseek.com
    chat-model: deepseek-chat
    vision-model: deepseek-vl
    max-tokens: 4000
    temperature: 0.7
  # 通义千问配置
  qwen:
    api-key: ${QWEN_API_KEY:your-qwen-api-key}
    base-url: https://dashscope.aliyuncs.com
    model: qwen-plus
  # 超时配置（毫秒）
  timeout: 30000
  # 重试次数
  retry: 3

qdrant:
  host: localhost
  port: 6333
  grpc-port: 6334
  collection-name: lawfirm-knowledge
  vector-size: 1024
  distance: Cosine
  timeout-seconds: 10

logging:
  level:
    root: INFO
    com.lawfirm: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/lawfirm-backend.log
    max-size: 100MB
    max-history: 30

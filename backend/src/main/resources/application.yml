server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: lawfirm-backend

  profiles:
    active: dev

  datasource:
    driver-class-name: org.h2.Driver
    # 默认相对路径：在 backend 目录下执行 mvn spring-boot:run 时写入 backend/data/
    url: jdbc:h2:file:${LAWFIRM_H2_PATH:./data/lawfirm};MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    hikari:
      # 连接池配置（支持50人并发）
      maximum-pool-size: 50          # 最大连接数：支持50人并发
      minimum-idle: 10               # 最小空闲连接数
      connection-timeout: 30000      # 连接超时：30秒
      idle-timeout: 600000           # 空闲连接超时：10分钟
      max-lifetime: 1800000          # 连接最大生命周期：30分钟
      # 连接测试配置
      connection-test-query: SELECT 1
      validation-timeout: 3000       # 验证超时：3秒
      # 连接泄漏检测
      leak-detection-threshold: 60000  # 泄漏检测阈值：60秒
      # 性能优化
      auto-commit: true              # 自动提交
      transaction-isolation: TRANSACTION_READ_COMMITTED  # 事务隔离级别

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
        globally_quoted_identifiers: true
    open-in-view: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

jwt:
  secret: ${JWT_SECRET:lawfirm-dev-jwt-secret-change-me}
  expiration: 86400000
  header: Authorization
  prefix: Bearer

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  accessKey: ${MINIO_ACCESS_KEY:minioadmin}
  secretKey: ${MINIO_SECRET_KEY:minioadmin}
  bucketName: lawfirm
  connectTimeout: 10000
  writeTimeout: 60000
  readTimeout: 10000

file:
  upload-path: ${LAWFIRM_UPLOAD_PATH:./uploads/}
  max-size: 52428800
  allowed-types:
    - image/jpeg
    - image/png
    - image/gif
    - application/pdf
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.ms-excel
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - text/plain

login:
  max-attempts: 5
  lock-duration: 1800000
  lock-enabled: true

backup:
  base-dir: ${LAWFIRM_BACKUP_DIR:./backups}
  retention-days: 180

# 须与库中已加密字段一致；生产环境请用环境变量 CRYPTO_SECRET_KEY 覆盖默认值
crypto:
  secret-key: ${CRYPTO_SECRET_KEY:lawfirm-secret-key-2024-aes-256-encryption}

ai:
  ocr:
    enabled: ${AI_OCR_ENABLED:true}
    # 视觉 OCR 建议 deepseek；本地 tesseract 仅文本层提取
    provider: ${AI_OCR_PROVIDER:tesseract}
    # DeepSeek 扫描版 PDF：分页渲染为图再调 Vision（控制成本）
    pdf-vision-max-pages: ${AI_OCR_PDF_VISION_MAX_PAGES:5}
    pdf-vision-dpi: ${AI_OCR_PDF_VISION_DPI:120}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: https://api.deepseek.com
    chat-model: deepseek-chat
    vision-model: deepseek-vl
    max-tokens: 4000
    temperature: 0.7
  ollama:
    base-url: http://localhost:11434
    model: qwen3:8b
    max-tokens: 2000
    temperature: 0.1
    timeout-seconds: 60
  aliyun:
    embedding:
      api-key: ${ALIYUN_API_KEY:your-aliyun-api-key}
      base-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
      model: text-embedding-v3
      dimension: 1024
      timeout-seconds: 30

# LLM API通用配置
llm:
  # DeepSeek配置
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
    base-url: https://api.deepseek.com
    chat-model: deepseek-chat
    vision-model: deepseek-vl
    max-tokens: 4000
    temperature: 0.7
  # 通义千问配置
  qwen:
    api-key: ${QWEN_API_KEY:your-qwen-api-key}
    base-url: https://dashscope.aliyuncs.com
    model: qwen-plus
  # LM Studio：OpenAI 兼容（本地 Qwen 等）；模型名与 LM Studio 界面一致
  lmstudio:
    base-url: ${LMSTUDIO_BASE_URL:http://127.0.0.1:1234}
    api-key: ${LMSTUDIO_API_KEY:lm-studio}
    chat-model: ${LMSTUDIO_MODEL:}
    max-tokens: 8192
    temperature: 0.7
  # 本地模型不可用时自动降级到云端
  fallback:
    enabled: ${LLM_FALLBACK_ENABLED:true}
    provider: ${LLM_FALLBACK_PROVIDER:deepseek}
  # 各业务首选 provider（库中 ai_config.provider_type，如 lmstudio / deepseek）
  routing:
    legal-chat: ${LLM_ROUTE_LEGAL_CHAT:lmstudio}
    rag: ${LLM_ROUTE_RAG:lmstudio}
    document: ${LLM_ROUTE_DOCUMENT:lmstudio}
    general-chat: ${LLM_ROUTE_GENERAL_CHAT:lmstudio}
    extract: ${LLM_ROUTE_EXTRACT:lmstudio}
    document-recognition-extract: ${LLM_ROUTE_DOC_EXTRACT:lmstudio}
    legacy-document: ${LLM_ROUTE_LEGACY_DOCUMENT:lmstudio}
  # 超时配置（毫秒）
  timeout: 30000
  # 重试次数
  retry: 3

# 内嵌 Agent 运行时（卷宗分析统一入口）
agent:
  runtime:
    # builtin=内置 Vision+LLM（默认）| openclaw=本机 OpenClaw Gateway | hermes=设备 Hermes
    provider: ${AGENT_PROVIDER:builtin}
    openclaw:
      base-url: ${OPENCLAW_BASE_URL:http://127.0.0.1:18789/v1}
      api-key: ${OPENCLAW_API_KEY:openclaw-local}
      model: ${OPENCLAW_MODEL:main}

# 设备侧 Hermes（接口就绪后设 agent.runtime.provider=hermes 并启用）
hermes:
  agent:
    enabled: ${HERMES_ENABLED:false}
    base-url: ${HERMES_BASE_URL:http://127.0.0.1:17888}
    connect-timeout-ms: 5000
    read-timeout-ms: 120000
    health-path: /health
    chat-path: /v1/chat
    analyze-path: /v1/analyze

case-search:
  semantic:
    enabled: ${CASE_SEARCH_SEMANTIC_ENABLED:false}

qdrant:
  enabled: ${QDRANT_ENABLED:false}
  host: localhost
  port: 6333
  grpc-port: 6334
  collection-name: lawfirm-knowledge
  vector-size: 1024
  distance: Cosine
  timeout-seconds: 10

logging:
  level:
    root: INFO
    com.lawfirm: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/lawfirm-backend.log
    max-size: 100MB
    max-history: 30

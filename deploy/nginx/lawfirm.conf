# 律所系统 Nginx 站点模板
# 安装：cp 到 /etc/nginx/sites-available/lawfirm 后修改 LAWFIRM_DOMAIN
# 启用：ln -s .../sites-enabled/ && nginx -t && systemctl reload nginx
# HTTPS：certbot --nginx -d 你的域名

upstream lawfirm_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP → HTTPS（certbot 安装证书后会自动补充 443 块；也可先仅监听 80 完成首次部署）
server {
    listen 80;
    listen [::]:80;
    server_name LAWFIRM_DOMAIN;

    # certbot 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    root /opt/lawfirm/app/frontend/dist;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://lawfirm_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;
}
